# GitHub Pages 자동 배포
# 이 브랜치에 파일을 올릴 때마다 웹 주소로 자동 배포됩니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/practical-albattani-oh9o0f]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
