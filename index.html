<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>두더지를 잡아라!</title>
<style>
/* ===================================================================
   두더지를 잡아라!  (전자칠판용 / index.html 한 파일로 실행)
   - 전자칠판(구형 안드로이드 WebView) 호환을 위해
     inset / flex의 gap / clamp() / mask-image / :has() / aspect-ratio 를
     사용하지 않았습니다.
   - 크기는 모두 vmin(화면 짧은 쪽의 1%) 단위 → 큰 화면에서도 비율 유지
   =================================================================== */

/* 공통 초기화 : 글자 선택 방지, 터치 하이라이트 제거 */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
html, body { height: 100%; }

/* 잔디밭 느낌의 배경 (외부 이미지 없이 CSS 그라데이션으로만 표현) */
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Jua Web', 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
  font-weight: bold;
  color: #fff;
  background-color: #6fc44a;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.18) 0, rgba(255,255,255,0) 22%),
    radial-gradient(circle at 88% 12%, rgba(255,255,255,.14) 0, rgba(255,255,255,0) 20%),
    linear-gradient(180deg, #9fe27a 0%, #6fc44a 45%, #4ea832 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  /* 터치 확대/스크롤 제스처 방지 */
  -ms-touch-action: manipulation;
  touch-action: manipulation;
}

/* 기관 로고 (왼쪽 위 고정 / 파일이 없으면 자동으로 숨김) */
#orgLogoFixed {
  position: fixed; top: 1.5vmin; left: 1.5vmin; z-index: 40;
  background: #fff; border-radius: 1.5vmin; padding: .9vmin 1.8vmin;
  box-shadow: 0 .4vmin 1vmin rgba(0,0,0,.25);
}
#orgLogoFixed img { height: 4.6vmin; display: block; }

/* ---------- 상단 제목 ---------- */
#title {
  margin: 1.6vmin 0 0 0;
  font-size: 7vmin;
  letter-spacing: .3vmin;
  color: #fff8d6;
  /* 멀리서도 잘 보이도록 굵은 외곽선 느낌의 그림자 */
  text-shadow:
    0 .6vmin 0 #2f7a1c,
    .35vmin .35vmin 0 #2f7a1c,
    -.35vmin .35vmin 0 #2f7a1c,
    .35vmin -.35vmin 0 #2f7a1c,
    -.35vmin -.35vmin 0 #2f7a1c;
}

/* ---------- 점수 / 남은 시간 / 시작 버튼 ---------- */
/* flex의 gap은 전자칠판에서 동작하지 않으므로 margin으로 간격을 줍니다 */
.row { display: flex; align-items: center; justify-content: center; }
.row > * + * { margin-left: 2.2vmin; }

#infoBar { margin-top: 1.4vmin; }

.panel {
  background: rgba(255,255,255,.92);
  color: #2f5d1a;
  border: .5vmin solid #3e8a22;
  border-radius: 2vmin;
  padding: 1vmin 3vmin;
  font-size: 4.2vmin;
  box-shadow: 0 .6vmin 0 rgba(0,0,0,.22);
  white-space: nowrap;
}
.panel .num { color: #d84315; font-size: 5vmin; }

/* 남은 시간 10초 이하 : 빨갛게 + 깜빡임 */
#timePanel.warn {
  background: #ffeb3b;
  border-color: #e53935;
  -webkit-animation: blink .5s infinite alternate;
  animation: blink .5s infinite alternate;
}
#timePanel.warn .num { color: #c62828; font-size: 6vmin; }
@-webkit-keyframes blink { from { transform: scale(1); } to { transform: scale(1.08); } }
@keyframes blink { from { transform: scale(1); } to { transform: scale(1.08); } }

/* ---------- 큰 버튼 (살짝 눌리는 효과) ---------- */
.bigBtn {
  font-family: inherit;
  font-weight: bold;
  font-size: 4.2vmin;
  color: #fff;
  padding: 1.4vmin 4.5vmin;
  border: none;
  border-radius: 2vmin;
  cursor: pointer;
  background: #f57c00;
  box-shadow: 0 .8vmin 0 rgba(0,0,0,.32);
  -webkit-transition: transform .05s, box-shadow .05s;
  transition: transform .05s, box-shadow .05s;
  -ms-touch-action: manipulation;
  touch-action: manipulation;
}
.bigBtn:active {
  transform: translateY(.6vmin);
  box-shadow: 0 .2vmin 0 rgba(0,0,0,.32);
}
.bigBtn[disabled] { background: #9e9e9e; box-shadow: 0 .8vmin 0 rgba(0,0,0,.22); }

/* ---------- 3 x 3 구멍 판 ---------- */
/* grid의 gap은 전자칠판에서도 정상 동작합니다 */
#board {
  margin-top: 1.8vmin;
  width: 60vmin;
  height: 60vmin;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  grid-gap: 2.2vmin;   /* 구버전 표기 */
  gap: 2.2vmin;
  -ms-touch-action: none;
  touch-action: none;
}

/* 구멍이 들어가는 칸 (점수 표시가 구멍 밖으로 떠오를 수 있게 감싸는 상자) */
.cell { position: relative; }

/* 구멍 : 갈색 타원 */
.hole {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow: hidden;
  border-radius: 50%;
  background: #6d4c26;
  background-image: radial-gradient(ellipse at 50% 30%, #3e2a12 0%, #5b3d1d 55%, #8b6135 100%);
  border: .9vmin solid #4b7d2a;
  box-shadow: inset 0 1.2vmin 2vmin rgba(0,0,0,.55), 0 .8vmin 0 rgba(0,0,0,.18);
  cursor: pointer;
}

/* 두더지 : 평소에는 구멍 아래에 숨어 있다가 위로 올라옴 */
.mole {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12vmin;
  line-height: 1;
  transform: translateY(110%);
  -webkit-transition: transform .12s ease-out;
  transition: transform .12s ease-out;
  cursor: pointer;
}
.mole.up { transform: translateY(6%); }

/* 두더지를 잡았을 때의 작은 애니메이션 */
.mole.hit {
  -webkit-animation: bonk .28s ease-out forwards;
  animation: bonk .28s ease-out forwards;
}
@-webkit-keyframes bonk {
  0%   { transform: translateY(6%) scale(1) rotate(0deg); }
  40%  { transform: translateY(6%) scale(1.35) rotate(-12deg); }
  100% { transform: translateY(110%) scale(.6) rotate(12deg); }
}
@keyframes bonk {
  0%   { transform: translateY(6%) scale(1) rotate(0deg); }
  40%  { transform: translateY(6%) scale(1.35) rotate(-12deg); }
  100% { transform: translateY(110%) scale(.6) rotate(12deg); }
}

/* 잡았을 때 구멍 위로 뜨는 "+10" 표시 */
.plus {
  position: absolute;
  left: 0; right: 0; top: -2vmin;
  text-align: center;
  font-size: 5.5vmin;
  color: #fff176;
  text-shadow: 0 .5vmin 0 #b34700, 0 0 1vmin rgba(0,0,0,.5);
  z-index: 5;
  pointer-events: none;
  -webkit-animation: floatUp .6s ease-out forwards;
  animation: floatUp .6s ease-out forwards;
}
@-webkit-keyframes floatUp {
  0%   { transform: translateY(2vmin); opacity: 1; }
  100% { transform: translateY(-6vmin); opacity: 0; }
}
@keyframes floatUp {
  0%   { transform: translateY(2vmin); opacity: 1; }
  100% { transform: translateY(-6vmin); opacity: 0; }
}

/* ---------- "잡았다!" 칭찬 메시지 ---------- */
/* 16:9 화면에서 구멍판 옆에 남는 공간에 표시 → 게임판을 가리지 않습니다 */
#praise {
  position: fixed;
  top: 42vmin; right: 3vmin;
  width: 32vmin;
  text-align: center;
  font-size: 7vmin;
  color: #e65100;
  background: #fffde7;
  border: .7vmin solid #f9a825;
  border-radius: 3vmin;
  padding: 1.5vmin 1vmin;
  box-shadow: 0 1vmin 0 rgba(0,0,0,.25);
  pointer-events: none;
  opacity: 0;
  z-index: 30;
}
#praise.show {
  -webkit-animation: praisePop .7s ease-out;
  animation: praisePop .7s ease-out;
}
@-webkit-keyframes praisePop {
  0%   { opacity: 0; transform: scale(.5); }
  25%  { opacity: 1; transform: scale(1.15); }
  70%  { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1); }
}
@keyframes praisePop {
  0%   { opacity: 0; transform: scale(.5); }
  25%  { opacity: 1; transform: scale(1.15); }
  70%  { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1); }
}

/* ---------- 왼쪽 안내판 (처음 보는 학생도 규칙을 바로 알 수 있게) ---------- */
#howTo {
  position: fixed;
  top: 42vmin; left: 3vmin;
  width: 32vmin;
  text-align: center;
  font-size: 3.4vmin;
  line-height: 1.7;
  word-break: keep-all;
  color: #2f5d1a;
  background: rgba(255,255,255,.88);
  border: .6vmin solid #3e8a22;
  border-radius: 3vmin;
  padding: 2vmin 1.5vmin;
  box-shadow: 0 1vmin 0 rgba(0,0,0,.2);
  z-index: 20;
}
#howTo .big { font-size: 6vmin; display: block; }

/* ---------- 난이도 선택 ---------- */
#diffBar { margin-top: 2vmin; }
#diffLabel {
  font-size: 3.6vmin;
  color: #fff;
  text-shadow: 0 .4vmin 0 #2f7a1c;
}
.diffBtn {
  font-family: inherit;
  font-weight: bold;
  font-size: 3.6vmin;
  color: #fff;
  padding: 1.2vmin 3.6vmin;
  border: .5vmin solid rgba(255,255,255,.6);
  border-radius: 1.8vmin;
  cursor: pointer;
  background: #2e7d32;
  box-shadow: 0 .7vmin 0 rgba(0,0,0,.3);
  -webkit-transition: transform .05s, box-shadow .05s;
  transition: transform .05s, box-shadow .05s;
  -ms-touch-action: manipulation;
  touch-action: manipulation;
}
.diffBtn:active { transform: translateY(.5vmin); box-shadow: 0 .2vmin 0 rgba(0,0,0,.3); }
/* 선택된 난이도 */
.diffBtn.on {
  background: #ffd54f;
  color: #5d4037;
  border-color: #fff;
}

/* ---------- 게임 종료 화면 (덮개) ---------- */
/* inset 대신 top/left/right/bottom 을 각각 지정 */
#overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(20,40,10,.82);
  z-index: 60;
}
#overlay.show { display: flex; }

#resultBox {
  background: #fffde7;
  color: #33691e;
  border: 1vmin solid #f9a825;
  border-radius: 3.5vmin;
  padding: 4vmin 8vmin;
  text-align: center;
  box-shadow: 0 1.5vmin 0 rgba(0,0,0,.35);
}
#resultBox > * + * { margin-top: 2.4vmin; }
#endTitle   { font-size: 8vmin; color: #e65100; }
#endScore   { font-size: 6.5vmin; color: #1b5e20; }
#endMsg     { font-size: 5.5vmin; color: #6a1b9a; }
</style>
</head>
<body>

  <!-- 기관 로고 : assets/gnmc_logo.png 가 없으면 자동으로 숨겨집니다 -->
  <div id="orgLogoFixed">
    <img src="assets/gnmc_logo.png" alt="경남수학문화관"
         onerror="document.getElementById('orgLogoFixed').style.display='none'">
  </div>

  <!-- 제목 -->
  <h1 id="title">두더지를 잡아라!</h1>

  <!-- 점수 / 남은 시간 / 시작 버튼 -->
  <div id="infoBar" class="row">
    <div class="panel">점수 <span class="num" id="scoreText">0</span>점</div>
    <div class="panel" id="timePanel">남은 시간 <span class="num" id="timeText">30</span>초</div>
    <button class="bigBtn" id="startBtn">게임 시작</button>
  </div>

  <!-- 3 x 3 구멍 (자바스크립트가 자동으로 만들어 줍니다) -->
  <div id="board"></div>

  <!-- 난이도 선택 -->
  <div id="diffBar" class="row">
    <span id="diffLabel">난이도</span>
    <button class="diffBtn" data-time="1200">쉬움</button>
    <button class="diffBtn on" data-time="800">보통</button>
    <button class="diffBtn" data-time="500">어려움</button>
  </div>

  <!-- 왼쪽 안내판 -->
  <div id="howTo">
    <span class="big">👆🐹</span>
    두더지를 손으로<br>톡! 터치하세요<br>한 마리에 10점
  </div>

  <!-- 잡았을 때 나오는 칭찬 메시지 -->
  <div id="praise"></div>

  <!-- 게임 종료 화면 -->
  <div id="overlay">
    <div id="resultBox">
      <div id="endTitle">게임 끝!</div>
      <div id="endScore">최종 점수: 0점</div>
      <div id="endMsg">잘했어요!</div>
      <button class="bigBtn" id="retryBtn">다시 하기</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* =================================================================
     1) 기본 설정값  ← 여기 숫자만 바꾸면 게임 난이도를 조절할 수 있어요
     ================================================================= */
  var GAME_TIME  = 30;    // 게임 시간(초)
  var HOLE_COUNT = 9;     // 구멍 개수 (3 x 3)
  var POINT      = 10;    // 두더지 한 마리당 점수
  var GAP_TIME   = 220;   // 두더지가 사라진 뒤 다시 나올 때까지의 시간(ms)

  var upTime = 800;       // 두더지가 나와 있는 시간(ms) — 난이도 버튼으로 바뀜

  /* =================================================================
     2) 화면 요소 가져오기
     ================================================================= */
  var board     = document.getElementById('board');
  var scoreText = document.getElementById('scoreText');
  var timeText  = document.getElementById('timeText');
  var timePanel = document.getElementById('timePanel');
  var startBtn  = document.getElementById('startBtn');
  var retryBtn  = document.getElementById('retryBtn');
  var overlay   = document.getElementById('overlay');
  var endScore  = document.getElementById('endScore');
  var endMsg    = document.getElementById('endMsg');
  var praise    = document.getElementById('praise');
  var diffBtns  = document.querySelectorAll('.diffBtn');

  /* =================================================================
     3) 게임 상태를 담는 변수들
     ================================================================= */
  var cells      = [];     // 구멍이 들어가는 칸 목록
  var holes      = [];     // 구멍 요소 목록
  var moles      = [];     // 두더지 요소 목록
  var playing    = false;  // 게임 진행 중인가?
  var score      = 0;      // 현재 점수
  var timeLeft   = GAME_TIME;
  var currentIdx = -1;     // 지금 두더지가 나와 있는 구멍 번호 (-1 이면 없음)
  var lastIdx    = -1;     // 직전에 두더지가 나왔던 구멍 번호
  var caught     = true;   // 지금 나온 두더지를 이미 잡았는가? (중복 터치 방지)
  var timerId    = null;   // 1초마다 도는 타이머
  var moleTimer  = null;   // 두더지 등장/퇴장 타이머
  var praiseTimer= null;

  /* =================================================================
     4) 효과음 : 외부 음원 파일 없이 Web Audio API 로 소리를 만듭니다
        (전자칠판에서는 화면을 한 번 눌러야 소리가 나므로
         시작 버튼을 누를 때 오디오를 깨워 줍니다)
     ================================================================= */
  var actx = null;

  function initAudio() {
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { actx = new AC(); }
      }
      if (actx && actx.state === 'suspended' && actx.resume) { actx.resume(); }
    } catch (e) { /* 소리가 안 나도 게임은 계속 진행됩니다 */ }
  }

  // freq: 음 높이, dur: 길이(초), type: 음색, vol: 크기, delay: 시작 지연(초)
  function beep(freq, dur, type, vol, delay) {
    try {
      if (!actx) { return; }
      var t = actx.currentTime + (delay || 0);
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol || 0.08, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  function soundHit()   { beep(880, 0.09, 'square', 0.09, 0);
                          beep(1320, 0.12, 'square', 0.08, 0.07); }  // 잡았을 때
  function soundStart() { beep(523, 0.12, 'triangle', 0.09, 0);
                          beep(659, 0.12, 'triangle', 0.09, 0.13);
                          beep(784, 0.20, 'triangle', 0.09, 0.26); } // 시작
  function soundEnd()   { beep(784, 0.16, 'sawtooth', 0.07, 0);
                          beep(587, 0.16, 'sawtooth', 0.07, 0.17);
                          beep(392, 0.35, 'sawtooth', 0.07, 0.34); } // 종료

  /* =================================================================
     5) 구멍 9개 만들기
     ================================================================= */
  function makeHoles() {
    var i;
    for (i = 0; i < HOLE_COUNT; i++) {
      var cell = document.createElement('div');
      cell.className = 'cell';

      var hole = document.createElement('div');
      hole.className = 'hole';

      var mole = document.createElement('div');
      mole.className = 'mole';
      mole.innerHTML = '🐹';   // 🐹 귀여운 두더지(햄스터) 이모지

      hole.appendChild(mole);
      cell.appendChild(hole);
      board.appendChild(cell);

      cells.push(cell);
      holes.push(hole);
      moles.push(mole);

      // 터치 영역을 크게 하려고 두더지가 아닌 '칸 전체'에 반응하게 합니다.
      // click 대신 pointerdown 을 쓰면 전자칠판에서 반응이 빠릅니다.
      addTap(cell, makeHandler(i));
    }
  }

  // 구멍 번호를 기억해 두는 함수 만들기
  function makeHandler(index) {
    return function (e) { whack(index, e); };
  }

  // 마우스 · 터치 · 펜을 모두 지원하는 입력 연결
  function addTap(el, fn) {
    if (window.PointerEvent) {
      el.addEventListener('pointerdown', function (e) {
        if (e.preventDefault) { e.preventDefault(); }
        fn(e);
      }, false);
    } else {
      // 구형 브라우저 대비 : 터치가 있으면 터치만, 없으면 마우스
      var touched = false;
      el.addEventListener('touchstart', function (e) {
        touched = true;
        if (e.preventDefault) { e.preventDefault(); }
        fn(e);
      }, false);
      el.addEventListener('mousedown', function (e) {
        if (touched) { return; }
        fn(e);
      }, false);
    }
  }

  /* =================================================================
     6) 두더지 등장 / 퇴장
     ================================================================= */
  function showMole() {
    if (!playing) { return; }

    // 직전과 다른 구멍을 고릅니다 (같은 자리 연속 등장 방지)
    var idx = Math.floor(Math.random() * HOLE_COUNT);
    if (idx === lastIdx) { idx = (idx + 1 + Math.floor(Math.random() * (HOLE_COUNT - 1))) % HOLE_COUNT; }

    currentIdx = idx;
    lastIdx = idx;
    caught = false;

    var mole = moles[idx];
    mole.className = 'mole up';   // 위로 쑥!

    // 정해진 시간이 지나면 스스로 사라지고, 잠시 뒤 다른 구멍에서 다시 나옵니다.
    moleTimer = setTimeout(function () {
      hideMole();
      moleTimer = setTimeout(showMole, GAP_TIME);
    }, upTime);
  }

  function hideMole() {
    if (currentIdx >= 0) {
      moles[currentIdx].className = 'mole';
    }
    currentIdx = -1;
    caught = true;
  }

  /* =================================================================
     7) 두더지 잡기
     ================================================================= */
  var PRAISE_WORDS = ['정답!', '잡았다!', '좋았어!', '멋져요!'];

  function whack(index, e) {
    // 게임 중이 아니거나, 두더지가 없는 구멍이거나,
    // 이미 잡은 두더지를 또 눌렀으면 아무 일도 일어나지 않습니다.
    // (빠르게 여러 번 눌러도 점수가 중복으로 오르지 않습니다)
    if (!playing || caught || index !== currentIdx) { return; }

    caught = true;
    score += POINT;
    scoreText.innerHTML = score;
    soundHit();

    // 잡히는 애니메이션
    var mole = moles[index];
    mole.className = 'mole up hit';

    // "+10" 점수 표시
    showPlus(cells[index]);

    // 칭찬 메시지
    showPraise(PRAISE_WORDS[Math.floor(Math.random() * PRAISE_WORDS.length)]);

    // 다음 두더지 예약 (기존 예약은 취소)
    if (moleTimer) { clearTimeout(moleTimer); }
    currentIdx = -1;
    moleTimer = setTimeout(function () {
      mole.className = 'mole';
      showMole();
    }, 280);
  }

  // 구멍 위에 "+10" 이 떠오르는 효과
  function showPlus(cell) {
    var p = document.createElement('div');
    p.className = 'plus';
    p.innerHTML = '+' + POINT;
    cell.appendChild(p);
    setTimeout(function () {
      if (p.parentNode) { p.parentNode.removeChild(p); }
    }, 650);
  }

  // 화면 가운데 위쪽에 큰 칭찬 글자를 보여 줍니다
  function showPraise(text) {
    praise.innerHTML = text;
    praise.className = '';
    // 애니메이션을 다시 시작시키기 위한 강제 리플로우
    void praise.offsetWidth;
    praise.className = 'show';
    if (praiseTimer) { clearTimeout(praiseTimer); }
    praiseTimer = setTimeout(function () { praise.className = ''; }, 700);
  }

  /* =================================================================
     8) 게임 시작 / 종료
     ================================================================= */
  function startGame() {
    if (playing) { return; }

    initAudio();     // 사용자가 버튼을 누른 지금이 소리를 켤 수 있는 시점입니다
    soundStart();

    playing  = true;
    score    = 0;
    timeLeft = GAME_TIME;

    scoreText.innerHTML = '0';
    timeText.innerHTML  = timeLeft;
    timePanel.className = 'panel';
    overlay.className   = '';
    startBtn.innerHTML  = '게임 중...';
    startBtn.disabled   = true;
    setDiffEnabled(false);   // 게임 중에는 난이도를 바꿀 수 없습니다

    // 모든 두더지 숨기기
    for (var i = 0; i < moles.length; i++) { moles[i].className = 'mole'; }
    currentIdx = -1;
    lastIdx = -1;
    caught = true;

    // 1초마다 남은 시간 줄이기
    timerId = setInterval(tick, 1000);

    // 두더지 등장 시작
    moleTimer = setTimeout(showMole, 400);
  }

  function tick() {
    timeLeft--;
    if (timeLeft < 0) { timeLeft = 0; }
    timeText.innerHTML = timeLeft;

    // 10초 이하면 더 눈에 띄게 표시
    if (timeLeft <= 10) { timePanel.className = 'panel warn'; }

    if (timeLeft <= 0) { endGame(); }
  }

  function endGame() {
    playing = false;
    if (timerId)   { clearInterval(timerId); timerId = null; }
    if (moleTimer) { clearTimeout(moleTimer); moleTimer = null; }
    hideMole();

    soundEnd();

    startBtn.innerHTML = '게임 시작';
    startBtn.disabled  = false;
    setDiffEnabled(true);

    endScore.innerHTML = '최종 점수: ' + score + '점';
    endMsg.innerHTML   = getMessage(score);
    overlay.className  = 'show';
  }

  // 점수에 따른 칭찬 메시지
  function getMessage(s) {
    if (s <= 50)  { return '조금만 더 힘내요!'; }
    if (s <= 100) { return '잘했어요!'; }
    if (s <= 150) { return '대단해요!'; }
    return '두더지 잡기 왕!';
  }

  /* =================================================================
     9) 난이도 선택 (게임 시작 전에만 바꿀 수 있습니다)
        쉬움 1.2초 / 보통 0.8초 / 어려움 0.5초
     ================================================================= */
  function setDiffEnabled(on) {
    for (var i = 0; i < diffBtns.length; i++) {
      diffBtns[i].disabled = !on;
      diffBtns[i].style.opacity = on ? '1' : '0.55';
    }
  }

  function chooseDiff(btn) {
    if (playing) { return; }
    upTime = parseInt(btn.getAttribute('data-time'), 10);
    for (var i = 0; i < diffBtns.length; i++) {
      diffBtns[i].className = 'diffBtn';
    }
    btn.className = 'diffBtn on';
    initAudio();
    beep(660, 0.07, 'triangle', 0.06, 0);
  }

  /* =================================================================
     10) 버튼 연결 & 시작 준비
     ================================================================= */
  makeHoles();

  addTap(startBtn, function () { startGame(); });
  addTap(retryBtn, function () { overlay.className = ''; startGame(); });

  (function bindDiff() {
    for (var i = 0; i < diffBtns.length; i++) {
      (function (btn) {
        addTap(btn, function () { chooseDiff(btn); });
      })(diffBtns[i]);
    }
  })();

  // 두 손가락 확대 / 더블탭 확대 방지
  document.addEventListener('gesturestart', function (e) {
    if (e.preventDefault) { e.preventDefault(); }
  }, false);

  var lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    var now = new Date().getTime();
    if (now - lastTouchEnd <= 350) {
      if (e.preventDefault) { e.preventDefault(); }
    }
    lastTouchEnd = now;
  }, false);

  // 마우스 오른쪽 버튼 메뉴 / 드래그 방지
  document.addEventListener('contextmenu', function (e) {
    if (e.preventDefault) { e.preventDefault(); }
  }, false);

  // 첫 화면 표시
  timeText.innerHTML  = GAME_TIME;
  scoreText.innerHTML = '0';
})();
</script>
</body>
</html>
